# Sloop — XcodeGen project spec.
#
# The .xcodeproj is generated, not checked in. On a Mac:
#     brew install xcodegen
#     xcodegen generate
#     open Sloop.xcodeproj
#
# The app is defined as two explicit targets, Sloop_iOS and Sloop_macOS, sharing
# one template (SloopApp) and the sources under App/Sloop. Explicit targets (vs a
# single `platform: [iOS, macOS]` target) let the macOS test bundle depend on a
# real target name — XcodeGen doesn't resolve multiplatform base names in
# dependencies or scheme test targets.

name: Sloop

options:
  bundleIdPrefix: org.szatmary.sloop
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  SloopKit:
    path: .

targetTemplates:
  SloopApp:
    type: application
    sources:
      - path: App/Sloop
    dependencies:
      - package: SwiftTerm
      - package: SloopKit
        product: SloopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szatmary.sloop
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        # arm64 only — Sloop does not support x86. Keeps simulator builds arm64
        # (no x86_64 slice) and matches the arm64-only libssh2 xcframework.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  Sloop_iOS:
    templates: [SloopApp]
    platform: iOS

  Sloop_macOS:
    templates: [SloopApp]
    platform: macOS
    # Run the app-level tests under the macOS scheme:
    #   xcodebuild test -scheme Sloop_macOS
    scheme:
      testTargets:
        - SloopTests

  SloopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SloopAppTests
    dependencies:
      - target: Sloop_macOS
      - package: SwiftTerm
      - package: SloopKit
        product: SloopKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.szatmary.sloop.tests
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
