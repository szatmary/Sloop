# Sloop — XcodeGen project spec.
#
# The .xcodeproj is generated, not checked in. On a Mac:
#     brew install xcodegen
#     xcodegen generate
#     open Sloop.xcodeproj
#
# The app is defined as two explicit targets, Sloop_iOS and Sloop_macOS, sharing
# one template (SloopApp) and the sources under App/Sloop. Explicit targets (vs a
# single `platform: [iOS, macOS]` target) let the macOS test bundle depend on a
# real target name — XcodeGen doesn't resolve multiplatform base names in
# dependencies or scheme test targets.

name: Sloop

options:
  bundleIdPrefix: org.szatmary.sloop
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Exact, not `from:`. The generated .xcodeproj is gitignored and so is the
    # Package.resolved beside it, so `from: "1.2.0"` meant nothing recorded
    # which revision a build used — it resolved to 1.18.0 in practice, sixteen
    # minor versions along, and would have moved again without notice. A
    # release has to be rebuildable, and the GPL corresponding-source claim has
    # to be able to name the SwiftTerm it shipped.
    exactVersion: "1.18.0"
  SloopKit:
    path: .

targetTemplates:
  # Everything that touches libssh2, the keychain, or tsnet, in a framework the
  # app and the File Provider extension both embed.
  #
  # It cannot live in SloopKit: that package is Foundation-only so `swift test`
  # runs on Linux CI, and libssh2 would end that. It cannot live in App/Sloop
  # either — those are the app target's sources, which an extension cannot
  # link. Hence a third layer.
  SloopSSHFramework:
    type: framework
    sources:
      - path: App/SloopSSH
    dependencies:
      - package: SloopKit
        product: SloopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szatmary.sloop.ssh
        # Both platform targets must produce the *same* module name, or
        # `import SloopSSH` resolves on one platform and not the other. Without
        # this the module would be SloopSSH_iOS / SloopSSH_macOS, after the
        # target names.
        PRODUCT_NAME: SloopSSH
        PRODUCT_MODULE_NAME: SloopSSH
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        # The extension loads this from the host app's Frameworks directory.
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES

  SloopApp:
    type: application
    sources:
      - path: App/Sloop
        excludes:
          # Master art for Scripts/generate-appicon.sh — not a bundle resource.
          - AppIcon.svg
          # Build input for CODE_SIGN_ENTITLEMENTS — not a bundle resource.
          - Sloop.entitlements
          # A StoreKit *testing* configuration for Xcode, not something the
          # shipped app reads. The tip jar it configures is hidden for v1
          # (Docs/LAUNCH.md); the file was reaching the bundle regardless.
          - Sloop.storekit
    dependencies:
      - package: SwiftTerm
      - package: SloopKit
        product: SloopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.szatmary.sloop
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # No GENERATE_INFOPLIST_FILE here — the app targets supply a real
        # Info.plist (see `info:` on each) so they can register ssh://.
        SWIFT_VERSION: "5.9"
        # App/Sloop/Assets.xcassets — regenerate from the SVG master with
        # Scripts/generate-appicon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Shared keychain group for the key library (iCloud-synced). Only
        # effective in signed builds; see SIGNING.md.
        CODE_SIGN_ENTITLEMENTS: App/Sloop/Sloop.entitlements
        # Required for notarization, and it denies task_for_pid: without it any
        # process running as the same user can attach to Sloop and read private
        # keys, passphrases and live session plaintext out of its memory.
        ENABLE_HARDENED_RUNTIME: YES
        # arm64 only — Sloop does not support x86. Keeps simulator builds arm64
        # (no x86_64 slice) and matches the arm64-only libssh2 xcframework.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"

# Info.plist contents shared by both apps.
#
# These used to be INFOPLIST_KEY_* build settings with
# GENERATE_INFOPLIST_FILE, which cannot express CFBundleURLTypes — it is an
# array of dictionaries, and only scalar keys have INFOPLIST_KEY_ equivalents.
# Registering ssh:// therefore means owning a real plist. XcodeGen writes one
# per target from the block below (see the `info:` on each target), so these
# stay in one place rather than being duplicated into two checked-in files.
#
# UILaunchScreen and UIApplicationSceneManifest replace the
# INFOPLIST_KEY_*_Generation flags, which only worked while Xcode was
# generating the file; the values written here are the defaults those flags
# produced. macOS ignores both.
infoPlistProperties: &infoPlistProperties
  # Defer to the build settings above. Without these two, XcodeGen writes its
  # own defaults ("1.0"/"1") into the plist, and a literal in the plist beats
  # MARKETING_VERSION / CURRENT_PROJECT_VERSION — so the app would have
  # silently reported version 1.0 from the moment it stopped generating its
  # own Info.plist.
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  # The targets are Sloop_iOS and Sloop_macOS so XcodeGen can name them in
  # dependencies, but that is a build-system detail the user should never see.
  # Without this the plist falls back to PRODUCT_NAME, so the home screen icon
  # reads "Sloop_iOS" — and because Files.app labels a file provider with its
  # containing app's display name, so does every location Sloop publishes.
  #
  # Here rather than as INFOPLIST_KEY_CFBundleDisplayName: that build setting
  # only applies while GENERATE_INFOPLIST_FILE is on, which it no longer is for
  # the app targets, so it would be silently ignored.
  CFBundleDisplayName: Sloop
  LSApplicationCategoryType: public.app-category.developer-tools
  UILaunchScreen: {}
  UIApplicationSceneManifest:
    UIApplicationSupportsMultipleScenes: false
  # Tapping an ssh://user@host link opens Sloop. Viewer, not Editor: Sloop
  # connects to the host a link names, it does not claim to edit anything.
  CFBundleURLTypes:
    - CFBundleURLName: org.szatmary.sloop.ssh
      CFBundleTypeRole: Viewer
      CFBundleURLSchemes: [ssh]

targets:
  SloopSSH_iOS:
    templates: [SloopSSHFramework]
    platform: iOS

  SloopSSH_macOS:
    templates: [SloopSSHFramework]
    platform: macOS

  Sloop_iOS:
    templates: [SloopApp]
    platform: iOS
    dependencies:
      - target: SloopSSH_iOS
        embed: true
    # Generated by `xcodegen generate` and gitignored, like the project itself.
    # Lives outside App/Sloop so the sources glob does not treat it as a
    # bundle resource (the same reason AppIcon.svg is excluded there).
    info:
      path: App/Info-iOS.plist
      properties: *infoPlistProperties

  Sloop_macOS:
    templates: [SloopApp]
    platform: macOS
    dependencies:
      - target: SloopSSH_macOS
        embed: true
    info:
      path: App/Info-macOS.plist
      properties: *infoPlistProperties
    # Run the app-level tests under the macOS scheme:
    #   xcodebuild test -scheme Sloop_macOS
    scheme:
      testTargets:
        - SloopTests

  SloopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SloopAppTests
    dependencies:
      - target: Sloop_macOS
      - target: SloopSSH_macOS
      - package: SwiftTerm
      - package: SloopKit
        product: SloopKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.szatmary.sloop.tests
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
