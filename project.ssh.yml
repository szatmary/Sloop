# SSH-enabled variant of the project. Layers the libssh2 xcframework onto the
# base project so `import CSSH` resolves and LibSSH2Transport compiles.
#
# Requires Vendor/libssh2.xcframework to be present (built by
# Scripts/build-libssh2.sh, or downloaded from the CI artifact). Generate with:
#     xcodegen generate --spec project.ssh.yml
#
# The base project.yml (no SSH) is included and each app target gains the
# framework dependency; everything else is inherited.
#
# Mosh is layered on top of THIS spec by project.mosh.yml — kept separate so the
# stable SSH build never depends on the experimental mosh cross-compile.
include:
  - project.yml

targets:
  Sloop_iOS:
    dependencies:
      - framework: Vendor/libssh2.xcframework
        embed: false
    settings:
      base:
        # Without this, libssh2-internal.h is invisible to Swift and agent
        # forwarding compiles only in the Mosh variant. project.mosh.yml sets
        # the same value; it layers on top of this spec, so the two agree.
        SWIFT_OBJC_BRIDGING_HEADER: App/Sloop/SSH/Sloop-Bridging-Header.h
  Sloop_macOS:
    dependencies:
      - framework: Vendor/libssh2.xcframework
        embed: false
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: App/Sloop/SSH/Sloop-Bridging-Header.h
