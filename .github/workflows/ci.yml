name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Serialize runs per ref so two pushes to main can't race on the `nightly`
# release tag (each release step deletes and recreates it). Don't cancel an
# in-progress run — a publish mid-flight should finish, not be interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sloopkit-tests:
    name: SloopKit unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

  app-build:
    name: Build app (iOS) · Test app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS
        run: xcodebuild build -project Sloop.xcodeproj -scheme Sloop_iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet
      # `test` builds the macOS app + its test bundle (SloopAppTests) and runs
      # the app-level tests on the runner.
      - name: Test macOS
        run: xcodebuild test -project Sloop.xcodeproj -scheme Sloop_macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet

  libssh2-xcframework:
    name: Build libssh2 xcframework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build xcframework
        run: ./Scripts/build-libssh2.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
          if-no-files-found: error

  protobuf-xcframework:
    name: Build protobuf xcframework (experimental · mosh M3)
    runs-on: macos-14
    # Brick 2a of Mosh (M3): a blind cross-compile being brought up. Keep
    # continue-on-error so its failures don't redden main or block app/release
    # jobs; drop it once protobuf builds reliably.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build protobuf xcframework
        run: ./Scripts/build-protobuf.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protobuf-xcframework
          path: Vendor/protobuf.xcframework
          if-no-files-found: error

  mosh-xcframework:
    name: Build mosh xcframework (experimental · mosh M3)
    runs-on: macos-14
    needs: protobuf-xcframework
    # Brick 2b: blind autotools cross-compile, single-slice bring-up. Keep
    # continue-on-error and don't fail on a missing xcframework yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download protobuf xcframework
        uses: actions/download-artifact@v4
        with:
          name: protobuf-xcframework
          path: Vendor/protobuf.xcframework
      - name: Build mosh xcframework
        run: ./Scripts/build-mosh.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosh-xcframework
          path: Vendor/mosh.xcframework
          if-no-files-found: error

  app-build-ssh:
    name: Build app with SSH (iOS · macOS)
    runs-on: macos-15
    needs: libssh2-xcframework
    steps:
      - uses: actions/checkout@v4
      - name: Download libssh2 xcframework
        uses: actions/download-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project (SSH)
        run: xcodegen generate --spec project.ssh.yml
      - name: Build iOS
        run: xcodebuild build -project Sloop.xcodeproj -scheme Sloop_iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build macOS
        run: xcodebuild build -project Sloop.xcodeproj -scheme Sloop_macOS -sdk macosx CODE_SIGNING_ALLOWED=NO -quiet

  app-build-mosh:
    name: Build app with Mosh (experimental · mosh M3)
    runs-on: macos-15
    needs: [libssh2-xcframework, protobuf-xcframework, mosh-xcframework]
    # The mosh cross-compile is still bringing up; keep this job from blocking
    # main while it stabilizes. The stable app-build-ssh job above does not
    # depend on mosh, so a red here never turns the SSH build red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download libssh2 xcframework
        uses: actions/download-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
      - name: Download protobuf xcframework
        uses: actions/download-artifact@v4
        with:
          name: protobuf-xcframework
          path: Vendor/protobuf.xcframework
      - name: Download mosh xcframework
        uses: actions/download-artifact@v4
        with:
          name: mosh-xcframework
          path: Vendor/mosh.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project (Mosh)
        run: xcodegen generate --spec project.mosh.yml
      - name: Build iOS
        run: xcodebuild build -project Sloop.xcodeproj -scheme Sloop_iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build macOS
        run: xcodebuild build -project Sloop.xcodeproj -scheme Sloop_macOS -sdk macosx CODE_SIGNING_ALLOWED=NO -quiet

  mac-release:
    name: Release build (macOS app + GitHub Release)
    runs-on: macos-15
    needs: libssh2-xcframework
    # Needed so the nightly/tagged release steps can create releases and tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download libssh2 xcframework
        uses: actions/download-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project (SSH)
        run: xcodegen generate --spec project.ssh.yml
      # Release, arm64, SSH-enabled. Unsigned for now — signing keys come later.
      - name: Build Release (unsigned)
        run: >
          xcodebuild build
          -project Sloop.xcodeproj
          -scheme Sloop_macOS
          -configuration Release
          -sdk macosx
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          -quiet
      - name: Package .app
        run: |
          set -euo pipefail
          APP="$(find build/dd/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "No .app found"; ls -R build/dd/Build/Products || true; exit 1; }
          echo "Packaging $APP"
          rm -rf build/pkg && mkdir -p build/pkg
          cp -R "$APP" build/pkg/Sloop.app
          ditto -c -k --keepParent build/pkg/Sloop.app Sloop-macOS.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sloop-macOS-app
          path: Sloop-macOS.zip
          if-no-files-found: error

      # Rolling pre-release: every push to main refreshes the `nightly` release
      # so the Releases page always has the newest unsigned macOS build at a
      # stable download URL. Recreated each time (delete + create) so the tag
      # moves to the current commit.
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly Sloop-macOS.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (latest main)" \
            --notes "Automated **unsigned** macOS build from the latest \`main\` (\`${GITHUB_SHA:0:7}\`). It's arm64 (Apple Silicon) and SSH-enabled. Gatekeeper will block it on first launch — right-click the app and choose **Open**. Code signing comes later."

      # Versioned release: pushing a tag like `v0.1.0` publishes a stable
      # release with the same macOS build attached.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" Sloop-macOS.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "**Unsigned** arm64 (Apple Silicon), SSH-enabled macOS build for \`$GITHUB_REF_NAME\`. Gatekeeper will block it on first launch — right-click the app and choose **Open**. Code signing comes later."
