name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sloopkit-tests:
    name: SloopKit unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --disable-sandbox

  project-generation:
    name: XcodeGen spec is valid
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
