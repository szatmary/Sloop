name: CI

# Runs on every push and pull request.
#
# It did not always. While the repository was private, macOS runners billed at
# ten times wall-clock and a day of ordinary pushing exhausted the allowance —
# after which every job failed in three seconds with no runner assigned and
# empty logs, which looks nothing like a billing limit from the outside. The
# workaround was a daily schedule behind a "did anything change?" gate, and the
# cost of it was that nothing was ever checked before it landed.
#
# Public repositories get Actions free, so that whole apparatus is gone. What
# replaces it is caching: the four native dependencies are pinned in their
# build scripts, so each one is rebuilt only when its script changes. A run
# that hits the caches skips roughly an hour of compiling OpenSSL, libssh2,
# protobuf, mosh and libtailscale from source.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. A superseded pull-request run is cancelled — the result is
# about to be irrelevant — while a run on main is left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here publishes. See the release job.
permissions:
  contents: read

env:
  # Bump to invalidate every dependency cache at once. The keys hash the build
  # scripts, which catches a change to what is built but not a change to what
  # builds it — a new Xcode on the runner image being the case that matters.
  CACHE_EPOCH: "1"

jobs:
  # ---------------------------------------------------------------- SloopKit

  sloopkit-linux:
    name: SloopKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  sloopkit-macos:
    name: SloopKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # ------------------------------------------------- Native dependencies
  #
  # Each restores a cache keyed on its own build script and builds only on a
  # miss, then hands the result to the app jobs as an artifact. Cache carries
  # the cost across runs; the artifact carries the result across jobs within
  # one run.

  libssh2:
    name: libssh2 xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: Vendor/libssh2.xcframework
          key: libssh2-${{ env.CACHE_EPOCH }}-macos15-${{ hashFiles('Scripts/build-libssh2.sh', 'Scripts/lib/vendor.sh', 'Scripts/deps/libssh2/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-libssh2.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
          if-no-files-found: error
          # Consumed by later jobs in this same run; anything past that is
          # someone downloading a build by hand. The 90-day default is what
          # filled the repository's storage with ninety identical copies.
          retention-days: 7

  protobuf:
    name: protobuf xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: Vendor/protobuf.xcframework
          key: protobuf-${{ env.CACHE_EPOCH }}-macos15-${{ hashFiles('Scripts/build-protobuf.sh', 'Scripts/lib/vendor.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-protobuf.sh
      - uses: actions/upload-artifact@v4
        with:
          name: protobuf-xcframework
          path: Vendor/protobuf.xcframework
          if-no-files-found: error
          retention-days: 7

  mosh:
    name: mosh xcframework
    runs-on: macos-15
    needs: protobuf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: protobuf-xcframework
          path: Vendor/protobuf.xcframework
      - id: cache
        uses: actions/cache@v4
        with:
          path: Vendor/mosh.xcframework
          # protobuf is merged whole into libmosh.a, so its build script is
          # part of what decides whether this artifact is still current.
          key: mosh-${{ env.CACHE_EPOCH }}-macos15-${{ hashFiles('Scripts/build-mosh.sh', 'Scripts/build-protobuf.sh', 'Scripts/lib/vendor.sh', 'Scripts/patches/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-mosh.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mosh-xcframework
          path: Vendor/mosh.xcframework
          if-no-files-found: error
          retention-days: 7

  libtailscale:
    name: libtailscale xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Exact, not '1.26'. A floating minor means local and CI artifacts
          # differ silently, and the GPL corresponding-source claim cannot name
          # what shipped.
          go-version: '1.26.3'
      - id: cache
        uses: actions/cache@v4
        with:
          path: Vendor/libtailscale.xcframework
          key: libtailscale-${{ env.CACHE_EPOCH }}-macos15-go1.26.3-${{ hashFiles('Scripts/build-libtailscale.sh', 'Scripts/libtailscale-sloop-*.go', 'Scripts/lib/vendor.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-libtailscale.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libtailscale-xcframework
          path: Vendor/libtailscale.xcframework
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------- App

  app:
    name: Build and test (full variant)
    runs-on: macos-15
    needs: [libssh2, mosh, libtailscale]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: mosh-xcframework
          path: Vendor/mosh.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: libtailscale-xcframework
          path: Vendor/libtailscale.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      # `project.tailscale.yml` includes mosh, which includes ssh, which
      # includes the base — so this is the only spec that has SSH, Mosh,
      # Tailscale and the File Provider extension at once. Tests used to run
      # against the base project instead, where seven of the fifteen app test
      # files are `#if canImport(CSSH)` and compiled out: CI proved the code
      # compiled and nothing more.
      - name: Generate project
        run: xcodegen generate --spec project.tailscale.yml
      - name: Build iOS
        run: xcodebuild build -project Sloop.xcodeproj -scheme Sloop_iOS -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO -quiet
      - name: Test macOS
        run: xcodebuild test -project Sloop.xcodeproj -scheme Sloop_macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet

  # --------------------------------------------------------------- Release
  #
  # Builds what a release actually is and publishes nothing.
  #
  # There used to be two publish steps here. One refreshed a `nightly` release
  # on every push to main, except that push only fired on tags, so it could
  # never run. The other attached an ad-hoc-signed, SSH-only build to any `v*`
  # tag — the wrong artifact, unsigned, and on a collision course with
  # Scripts/sign-release.sh, which does the real thing locally.
  #
  # Nothing is published until notarization exists (Docs/SIGNING.md) and the
  # portal prerequisites are registered (Docs/LAUNCH.md §1). The build runs
  # anyway, so the day those land the pipeline is already correct.

  release-build:
    name: Release build (unsigned)
    runs-on: macos-15
    needs: [libssh2, mosh, libtailscale]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libssh2-xcframework
          path: Vendor/libssh2.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: mosh-xcframework
          path: Vendor/mosh.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: libtailscale-xcframework
          path: Vendor/libtailscale.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.tailscale.yml
      - name: Build Release
        run: >
          xcodebuild build
          -project Sloop.xcodeproj
          -scheme Sloop_macOS
          -configuration Release
          -sdk macosx
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          -quiet
      - name: Package
        run: |
          set -euo pipefail
          APP="$(find build/dd/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "no .app produced"; ls -R build/dd/Build/Products || true; exit 1; }
          rm -rf build/pkg && mkdir -p build/pkg
          cp -R "$APP" build/pkg/Sloop.app
          ditto -c -k --keepParent build/pkg/Sloop.app Sloop-macOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sloop-macOS-unsigned
          path: Sloop-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
